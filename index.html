<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours at the Library</title>
<style>
:root{
  --ink:#000;--paper:#fffbe8;--yel:#ffe600;--cya:#00e5ff;--mag:#ff2bd6;--lim:#b6ff00;--ora:#ff8a00;--red:#ff3355;--vio:#9d7bff;--grn:#2ee86a;
  --c:#ffe600;
  --fd:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --fb:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --fm:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html{font-size:28px;background:#000}
body{margin:0;color:#fff;font-family:var(--fb);line-height:1.38;min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%;
  background-color:#000;
  background-image:radial-gradient(rgba(255,43,214,.22) 1.6px,transparent 1.8px),radial-gradient(rgba(0,229,255,.18) 1.6px,transparent 1.8px);
  background-size:22px 22px,22px 22px;background-position:0 0,11px 11px}
button{font:inherit;font-size:1rem;color:inherit;-webkit-tap-highlight-color:transparent}
.disp{font-family:var(--fd);font-weight:900;letter-spacing:.01em;line-height:1.08}
h1,h2,h3{font-family:var(--fd);font-weight:900;line-height:1.1;margin:.15rem 0}
h1{font-size:1.5rem}h2{font-size:1.15rem}
p{margin:.35rem 0}
.mut{color:#d8d8e8}

/* top strip */
.strip{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:.25rem;padding:.25rem .4rem;background:var(--yel);color:#000;border-bottom:5px solid #000;box-shadow:0 5px 0 var(--mag)}
.strip .ttl{flex:1 1 auto;min-width:5rem;font-family:var(--fd);font-weight:900;font-size:.85rem;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .2rem}
.sb{min-height:2.2rem;min-width:2.2rem;padding:.05rem .4rem;border:3px solid #000;border-radius:.3rem;background:#fff;color:#000;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 #000;line-height:1}
.sb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.sb.off{background:#ccc}

main{max-width:1100px;margin:0 auto;padding:.7rem .6rem 4rem;overflow-wrap:break-word}

/* comic panels */
.panel{position:relative;background:#111;border:4px solid #fff;border-radius:.2rem;padding:.7rem .8rem;margin:.7rem .2rem;box-shadow:7px 7px 0 var(--c)}
.panel.tilt{transform:rotate(-.5deg)}
.panel.paper{background:var(--paper);color:#111;border-color:#000;box-shadow:7px 7px 0 var(--c)}
.cap{display:inline-block;background:var(--c);color:#000;font-family:var(--fd);font-weight:900;font-size:.8rem;padding:.05rem .5rem;border:3px solid #000;transform:skew(-8deg);margin-bottom:.3rem}
.big{font-size:1.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.3rem;padding:.3rem 1rem;margin:.35rem .4rem .35rem 0;border:4px solid #000;border-radius:.3rem;background:var(--c);color:#000;font-family:var(--fd);font-weight:900;cursor:pointer;box-shadow:5px 5px 0 #fff;transform:skew(-6deg);text-align:center}
.btn>span{display:inline-block;transform:skew(6deg)}
.btn:active{transform:skew(-6deg) translate(3px,3px);box-shadow:2px 2px 0 #fff}
.btn.white{background:#fff}
.btn.dark{background:#222;color:#fff;border-color:#fff;box-shadow:5px 5px 0 var(--c)}
.btn:focus-visible,.sb:focus-visible{outline:4px solid var(--cya);outline-offset:3px}
.warn{background:#2a2100;border:3px dashed var(--yel);padding:.5rem .7rem;margin:.5rem 0;color:#fff2a8}
.teamin{font:inherit;font-size:1rem;width:100%;max-width:18rem;min-height:2.3rem;padding:.3rem .6rem;border:4px solid #000;background:#fff;color:#000;box-shadow:4px 4px 0 var(--mag)}

/* cover */
.cover{text-align:center;padding:1rem .6rem}
.cover .t1{font-family:var(--fd);font-weight:900;font-style:italic;font-size:2.1rem;line-height:1;color:var(--yel);text-shadow:4px 4px 0 var(--mag),8px 8px 0 #000;transform:rotate(-3deg);display:inline-block;margin:.4rem 0}
.cover .t2{display:inline-block;background:var(--cya);color:#000;font-family:var(--fd);font-weight:900;padding:.1rem .6rem;border:4px solid #000;transform:rotate(2deg)}
.cover .em{font-size:2.4rem}

/* Libby */
.libby{display:flex;gap:.6rem;align-items:flex-start;margin:.4rem 0}
.libby .bot{font-size:2.6rem;line-height:1;flex:0 0 auto;filter:drop-shadow(3px 3px 0 var(--cya))}
.libby.talk .bot{animation:talk .25s infinite alternate}
.bub{position:relative;flex:1 1 auto;background:#fff;color:#000;border:4px solid #000;border-radius:1.2rem;padding:.45rem .8rem;box-shadow:5px 5px 0 var(--cya)}
.bub:before{content:"";position:absolute;left:-1.05rem;top:.8rem;border:.55rem solid transparent;border-right:.75rem solid #000}
.bub .who{display:block;font-family:var(--fd);font-weight:900;font-size:.78rem;color:#7a00a8}
.bub .hid{filter:blur(6px);user-select:none}
.ctrls{display:flex;flex-wrap:wrap;gap:.35rem;margin:.35rem 0 .2rem}
.cb{min-height:2.2rem;padding:.1rem .6rem;border:3px solid #fff;border-radius:2rem;background:#1b1b28;color:#fff;cursor:pointer;font-weight:700}
.cb.on{background:var(--cya);color:#000;border-color:#000}

/* note from librarian */
.note{background:#fff7a8;color:#222;border:0;padding:.7rem .9rem;transform:rotate(1.2deg);box-shadow:6px 6px 0 rgba(0,0,0,.6),0 0 0 4px #000;font-family:var(--fb);margin:.8rem .3rem}
.note p{margin:.3rem 0}

/* borrower card */
.card{background:var(--paper);color:#222;border:4px solid #000;border-radius:.5rem;padding:.5rem .7rem;box-shadow:7px 7px 0 var(--mag);margin:.5rem .2rem .8rem}
.card .ch{display:flex;justify-content:space-between;flex-wrap:wrap;gap:.3rem;border-bottom:3px double #000;padding-bottom:.2rem;margin-bottom:.4rem}
.card .ch b{font-family:var(--fd);font-weight:900;letter-spacing:.06em}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.3rem}
.slot{aspect-ratio:1/1;border:2px dashed #9a8f6b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;color:#c9bf9e;font-size:.8rem;max-width:3.2rem;width:100%;justify-self:center}
.slot.st{border:4px solid #d1003f;color:#d1003f;font-size:1.25rem;transform:rotate(-12deg);background:rgba(209,0,63,.07)}
.slot.st.new{animation:stamp .7s cubic-bezier(.2,1.6,.4,1)}
.clock{font-family:var(--fm);font-weight:700}

/* floor plan */
.plan{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:6px solid #fff;background:#0b0b10;margin:.3rem .2rem 1rem;box-shadow:8px 8px 0 var(--cya)}
.zone{position:relative;grid-column:span 2;min-height:6.4rem;border:3px solid #fff;margin:-1.5px;background:var(--c);color:#000;cursor:pointer;text-align:left;padding:.4rem .5rem;display:flex;flex-direction:column;gap:.05rem;overflow:hidden;
  background-image:radial-gradient(rgba(0,0,0,.16) 1.5px,transparent 1.7px);background-size:10px 10px}
.zone.w3{grid-column:span 3}.zone.w4{grid-column:span 4}.zone.w6{grid-column:span 6}
.zone .ze{font-size:1.9rem;line-height:1}
.zone .zn{font-size:.75rem;font-weight:900;font-family:var(--fd)}
.zone .zt{font-family:var(--fd);font-weight:900;font-size:.98rem;line-height:1.1}
.zone .zs{font-size:.78rem;font-weight:700;margin-top:auto}
.zone .tc{display:inline-block;background:#000;color:#fff;font-size:.7rem;padding:0 .3rem;align-self:flex-start;font-weight:700}
.zone .zl{position:absolute;right:.35rem;top:.3rem;font-size:1.3rem}
.zone:hover,.zone:focus-visible{outline:5px solid #fff;outline-offset:-8px;z-index:2}
.zone.done{background:#1a1a1a;color:#fff;background-image:none}
.zone.done .zs{color:var(--grn)}
.zone .stampz{position:absolute;right:.4rem;bottom:.4rem;width:2.4rem;height:2.4rem;border:4px solid #ff3d6e;border-radius:50%;color:#ff3d6e;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;font-size:1.2rem;transform:rotate(-14deg)}
.zone.exit{min-height:5rem;background:#222;color:#fff;background-image:repeating-linear-gradient(45deg,#222 0 18px,#2d2d2d 18px 36px)}
.zone.exit.open{background:var(--grn);color:#000;background-image:none}
.zone.soon{opacity:.35;cursor:not-allowed}
.avatar{position:absolute;z-index:5;font-size:1.8rem;line-height:1;pointer-events:none;transition:left .6s ease,top .6s ease;filter:drop-shadow(2px 2px 0 #000)}
.avatar.walk{animation:hop .2s infinite alternate}
.legend{font-size:.78rem;color:#ddd}

/* zone screen */
.zhead{display:flex;gap:.6rem;align-items:center;background:var(--c);color:#000;border:4px solid #000;padding:.4rem .7rem;margin:.3rem .2rem .2rem;box-shadow:7px 7px 0 #fff;transform:skew(-3deg)}
.zhead>*{transform:skew(3deg)}
.zhead .ze{font-size:2.4rem;line-height:1}
.zhead .zn{font-size:.8rem;font-weight:900}
.pages{display:flex;flex-wrap:wrap;gap:.2rem;margin:.6rem .2rem .2rem}
.pages i{width:.8rem;height:.8rem;border:2px solid #fff;transform:skew(-10deg);background:#222}
.pages i.d{background:var(--c)}
.pages i.n{background:#fff}
.q{font-size:1.05rem;font-weight:700;margin:.25rem 0 .5rem}
.sit{background:#222;border-left:8px solid var(--c);padding:.35rem .6rem;margin:.2rem 0 .4rem}

/* pick bubbles */
.picks{display:flex;flex-direction:column;gap:.45rem}
.pk{position:relative;text-align:left;min-height:2.3rem;padding:.4rem .8rem;border:4px solid #000;border-radius:1.1rem;background:#fff;color:#000;cursor:pointer;box-shadow:4px 4px 0 var(--c);line-height:1.3;overflow-wrap:anywhere}
.pk:hover:not([disabled]),.pk:focus-visible{background:#fffbd0;outline:3px solid var(--cya)}
.pk.x{background:#3a0b16;color:#ff9db0;border-color:var(--red);text-decoration:line-through;box-shadow:none}
.pk.ok{background:var(--grn);border-color:#000;font-weight:700}
.pk[disabled]{cursor:default}
.arrows{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.arw{min-height:4.2rem;border:5px solid #000;background:#fff;color:#000;font-family:var(--fd);font-weight:900;font-size:1.6rem;cursor:pointer;box-shadow:6px 6px 0 var(--c);border-radius:.4rem}
.arw small{display:block;font-size:.7rem;font-family:var(--fb)}
.arw.x{background:#3a0b16;color:#ff9db0;border-color:var(--red)}
.arw.ok{background:var(--grn)}
.qline{font-family:var(--fd);font-weight:900;font-size:1.35rem;text-align:center;background:#fff;color:#000;border:4px solid #000;padding:.4rem .6rem;margin:.3rem 0 .6rem;box-shadow:5px 5px 0 var(--c)}
svg.voice{display:block;width:100%;height:3rem;margin:.2rem 0}

/* linking */
.lk{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.1rem;font-family:var(--fd);font-weight:900;font-size:1.5rem;background:#fff;color:#000;border:4px solid #000;padding:.6rem .4rem;box-shadow:5px 5px 0 var(--c);margin:.3rem 0 .5rem}
.gapb{min-width:2.1rem;min-height:2.3rem;border:3px dashed #888;border-radius:.4rem;background:#f1f1f1;cursor:pointer;color:var(--mag);font-size:1.3rem;font-weight:900;padding:0}
.gapb.on{border:3px solid var(--mag);background:#ffe3fa}
.gapb.x{border-color:var(--red);background:#ffd6dd}

/* swipe */
.deck{position:relative;height:11rem;margin:.4rem 0 .6rem;touch-action:pan-y}
.scard{position:absolute;inset:0;margin:auto;max-width:20rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.3rem;background:#fff;color:#000;border:5px solid #000;border-radius:1rem;padding:.6rem;box-shadow:7px 7px 0 var(--c);font-weight:700;font-size:1.05rem;cursor:grab;user-select:none;touch-action:none;transition:transform .25s}
.scard .se{font-size:2.2rem;line-height:1}
.scard.drag{transition:none;cursor:grabbing}
.scard.flyL{transform:translateX(-160%) rotate(-25deg)!important;opacity:0;transition:transform .45s,opacity .45s}
.scard.flyR{transform:translateX(160%) rotate(25deg)!important;opacity:0;transition:transform .45s,opacity .45s}
.scard.under{transform:scale(.94) translateY(.5rem);opacity:.6;cursor:default}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.side{min-height:2.8rem;border:4px solid #000;font-weight:900;cursor:pointer;border-radius:.4rem;padding:.2rem .4rem;box-shadow:4px 4px 0 #fff}
.side.l{background:#ff9db0;color:#000}.side.r{background:var(--grn);color:#000}
.side.x{opacity:.5;text-decoration:line-through}

/* feedback bursts */
.fb{display:flex;gap:.6rem;align-items:center;margin:.6rem 0;animation:popin .35s}
.burst{flex:0 0 auto;width:5.2rem;height:5.2rem;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;font-style:italic;font-size:1.05rem;color:#000;background:var(--yel);
  clip-path:polygon(50% 0,61% 22%,85% 8%,78% 33%,100% 40%,80% 56%,95% 80%,68% 74%,60% 100%,47% 79%,27% 96%,27% 70%,3% 76%,17% 55%,0 38%,24% 32%,14% 8%,39% 22%);transform:rotate(-8deg)}
.fb.bad .burst{background:var(--red);color:#fff}
.fb .fbt{flex:1 1 auto;background:#fff;color:#000;border:4px solid #000;padding:.4rem .7rem;box-shadow:4px 4px 0 var(--yel)}
.fb.bad .fbt{box-shadow:4px 4px 0 var(--red)}

/* unlock */
.unlock{text-align:center}
.bigstamp{display:inline-flex;align-items:center;justify-content:center;width:6rem;height:6rem;border:8px solid #ff3d6e;border-radius:50%;color:#ff3d6e;font-family:var(--fd);font-weight:900;font-size:3.4rem;transform:rotate(-14deg);animation:stamp .8s .2s cubic-bezier(.2,1.6,.4,1) both;background:rgba(255,61,110,.08)}
.stars{font-size:1.6rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.saved{position:fixed;right:.6rem;bottom:.6rem;z-index:40;background:var(--grn);color:#000;border:3px solid #000;font-weight:900;padding:.05rem .6rem;font-size:.75rem;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

/* web page mockup */
.web{background:#fff;color:#111;border:4px solid #000;box-shadow:6px 6px 0 var(--c);margin:.3rem 0 .5rem;font-size:.85rem}
.web .wbar{background:#ddd;border-bottom:3px solid #000;padding:.2rem .5rem;font-family:var(--fm);font-size:.8rem;overflow-wrap:anywhere}
.web .wb{padding:.4rem .6rem}
.web .wt{font-family:var(--fd);font-weight:900;font-size:1.25rem;color:#7a00a8}
details.again summary{cursor:pointer;min-height:2.2rem;display:inline-flex;align-items:center;padding:.1rem .7rem;border:3px solid #fff;border-radius:2rem;font-weight:700;background:#1b1b28}

@keyframes talk{to{transform:translateY(-3px) rotate(3deg)}}
@keyframes hop{to{transform:translateY(-5px)}}
@keyframes stamp{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-14deg)}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  main{padding:.5rem .35rem 3rem}.panel{padding:.55rem .6rem;margin:.6rem .15rem}
  .plan{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zone,.zone.w3,.zone.w4{grid-column:span 1}.zone.w6{grid-column:span 2}
  .zone .zt{font-size:.85rem;overflow-wrap:anywhere}
  .strip .ttl{order:9;flex-basis:100%}.wide{display:none}
  .slots{grid-template-columns:repeat(6,minmax(0,1fr))}
  .burst{width:4.2rem;height:4.2rem;font-size:.85rem}
}

.zone.here .zl{visibility:hidden}
.avatar{font-size:1.5rem}
.lbc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.35rem}
.lbc .cb{border-radius:.8rem;text-align:left;padding:.2rem .5rem}
@media (min-width:900px){.lbc{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:380px){.lbc{grid-template-columns:1fr}}
/* ---- Section 2 ---- */
.vb{background:var(--yel);color:#000;padding:0 .3rem;font-family:var(--fd)}
.shelf{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:.35rem;flex-wrap:wrap;min-height:13rem;padding:.8rem .5rem .4rem;background:#3b2414;border:5px solid #000;box-shadow:6px 6px 0 var(--c);
  background-image:linear-gradient(#5a3a22 0 0);background-size:100% .5rem;background-position:bottom;background-repeat:no-repeat;touch-action:none;overflow:hidden}
.spine{position:relative;width:3.1rem;height:11rem;max-height:calc(var(--h)*12rem/100*1.5);border:3px solid #000;border-radius:.3rem .3rem 0 0;background:var(--b);color:#fff;cursor:pointer;padding:.3rem 0;display:flex;align-items:center;justify-content:center;box-shadow:inset -6px 0 0 rgba(0,0,0,.25)}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--fd);font-weight:900;font-size:1rem;text-shadow:2px 2px 0 #000;white-space:nowrap}
.spine.x{opacity:.35;text-decoration:line-through}
.spine.ok{outline:5px solid var(--grn);outline-offset:2px}
.shelf .dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),rgba(255,240,170,.18) 0,rgba(0,0,0,0) 5rem,rgba(0,0,0,.95) 7.4rem);transition:background .05s}
.shelf.lit .dark{display:none}
.drawer{background:#3d2a12;border:5px solid #000;padding:.6rem;box-shadow:6px 6px 0 var(--c);display:flex;flex-direction:column;gap:.7rem}
.dline{background:var(--paper);color:#111;border:3px solid #000;padding:.5rem .6rem;line-height:2.4;font-size:1.05rem}
.dial{display:inline-flex;align-items:center;gap:.15rem;vertical-align:middle;background:#222;border:3px solid #000;border-radius:.5rem;padding:.1rem;margin:0 .15rem}
.dbtn{min-width:2.2rem;min-height:2.2rem;border:2px solid #000;background:var(--c);color:#000;font-weight:900;cursor:pointer;border-radius:.3rem;padding:0}
.dwin{display:inline-block;min-width:4.5rem;text-align:center;background:#fff;color:#000;font-family:var(--fd);font-weight:900;padding:.05rem .4rem;border:2px solid #000;line-height:1.4}
.dial.ok .dwin{background:var(--grn)}
.dial.bad{background:var(--red)}
.slip{background:#fff7a8;color:#222;border:3px solid #000;padding:.4rem .7rem;transform:rotate(-1deg);box-shadow:4px 4px 0 #000;margin:.2rem 0 .7rem}
.pbox{background:#f3f3f3;color:#111;border:4px solid #000;box-shadow:6px 6px 0 var(--c)}
.ptitle{background:#222;color:#fff;font-family:var(--fd);font-weight:900;padding:.2rem .6rem}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:.6rem;padding:.6rem}
.prev{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.pp{width:100%;max-width:7rem;aspect-ratio:3/4;background:#fff;border:2px solid #999;padding:.3rem;font-size:.6rem;display:flex;flex-direction:column;gap:.2rem;box-shadow:3px 3px 0 #bbb}
.pp i{display:block;height:.25rem;background:#9ab}
.pp .pic{font-size:1.2rem;text-align:center}
.prev.bw .pp{filter:grayscale(1)}
.pcount{font-size:.75rem;font-weight:700}
.pset{display:flex;flex-direction:column;gap:.35rem}
.prow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem;border:2px solid #ccc;background:#fff;padding:.2rem .4rem;border-radius:.3rem}
.prow.bad{border-color:var(--red);background:#ffe0e5}
.prow.ok{border-color:#1a9c47}
.pl{font-weight:900;font-size:.85rem}
.pctl{display:inline-flex;align-items:center;gap:.2rem}
.pbtn{min-width:2.1rem;min-height:2.1rem;border:2px solid #000;background:#ddd;cursor:pointer;border-radius:.3rem;font-weight:900}
.pval{min-width:5.5rem;text-align:center;font-weight:700;font-size:.9rem}
.pfoot{display:flex;justify-content:flex-end;flex-wrap:wrap;padding:.2rem .6rem .5rem}
.paperout{text-align:center;font-size:2.4rem;animation:paper 1s ease}
@keyframes paper{from{transform:translateY(-2.5rem);opacity:0}to{transform:none;opacity:1}}
.pc{background:#d6d6d6;color:#111;border:5px solid #000;box-shadow:6px 6px 0 var(--c);font-size:.82rem}
.pc .hs{cursor:pointer;border:3px solid transparent;border-radius:.3rem}
.pc .hs:hover,.pc .hs:focus-visible{border-color:#ff8a00;outline:none}
.pc .hs.hok{border-color:#1a9c47!important;box-shadow:0 0 0 4px #1a9c47;background:#c9f7d6!important}
.pc .hs.hbad{border-color:var(--red)!important;box-shadow:0 0 0 4px var(--red);animation:shake .4s}
.pc-tabs{display:flex;align-items:flex-end;gap:.2rem;background:#9a9a9a;padding:.25rem .25rem 0;flex-wrap:wrap}
.pc-tab{background:#c8c8c8;padding:.1rem .5rem;border-radius:.4rem .4rem 0 0}
.pc-tab.on{background:#fff}

<div id="app"></div>
<script>
(function(){
'use strict';
/* ===== After Hours at the Library: engine ===== */
var KEY='vu23560_l3_after_hours_library_v2';
var SIZES=[24,28,34,42];
var PHRASE='SLOWDOWNABIT';
var S, STORE=false, FLASH=null, RESET_ARMED=false, REVEAL={};

function storageOK(){ try{ var k='__t'+Math.random(); localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function fresh(){ return {v:1,team:'',view:'cover',zone:null,zones:{},letters:[],t0:0,t1:0,size:1,mute:false,at:0,back:false,newStamp:0}; }
function load(){
  STORE=storageOK(); S=fresh(); if(!STORE) return;
  try{ var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.v===1){ S=o; S.back=(S.view!=='win'&&S.view!=='cover'&&S.view!=='intro'); if(S.view==='zone'||S.view==='stamp') S.view='plan'; S.newStamp=0; } } }catch(e){}
}
var savedT=null;
function save(show){ if(!STORE) return; try{ localStorage.setItem(KEY,JSON.stringify(S)); if(show){ var el=$('saved'); if(el){ el.className='saved show'; clearTimeout(savedT); savedT=setTimeout(function(){ el.className='saved'; },900); } } }catch(e){} }
function $(id){ return document.getElementById(id); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function range(n){ var a=[]; for(var i=0;i<n;i++) a.push(i); return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function zoneById(id){ for(var i=0;i<ZONES.length;i++) if(ZONES[i].id===id) return ZONES[i]; return null; }
function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function reducedMotion(){ try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }

/* ---------- sound ---------- */
var AC=null;
function tone(f,t0,d,type,vol){ var o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(vol||0.12,AC.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+t0+d); o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+t0); o.stop(AC.currentTime+t0+d+0.05); }
function sfx(k){
  if(S.mute) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(k==='good'){ tone(523,0,.1,'square',.06); tone(784,.08,.1,'square',.06); tone(1047,.16,.18,'square',.06); }
    else if(k==='bad'){ tone(220,0,.15,'sawtooth',.06); tone(160,.14,.25,'sawtooth',.06); }
    else if(k==='tap'){ tone(700,0,.05,'triangle',.05); }
    else if(k==='stamp'){ tone(90,0,.18,'square',.2); tone(60,.05,.2,'sine',.25); }
    else if(k==='walk'){ [0,.12,.24,.36].forEach(function(t){ tone(300,t,.05,'triangle',.04); }); }
    else if(k==='win'){ [392,523,659,784,659,784,1047].forEach(function(f,i){ tone(f,i*.12,.3,'square',.07); }); }
  }catch(e){}
}

/* ---------- Libby's voice ---------- */
var VOICE=null;
function pickVoice(){ try{ var vs=speechSynthesis.getVoices(), pref=['en-AU','en_AU','en-GB','en_GB','en-US','en_US']; for(var p=0;p<pref.length;p++) for(var i=0;i<vs.length;i++) if(vs[i].lang===pref[p]) return vs[i]; for(var j=0;j<vs.length;j++) if(/^en/i.test(vs[j].lang)) return vs[j]; }catch(e){} return null; }
var SPK=0;
function stopPlayer(){ if(typeof PLAYER!=='undefined') PLAYER.on=false; stopSpeech(); }
function stopSpeech(){ SPK++; try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
function speak(t,rate,onEnd){
  try{ if(!window.speechSynthesis){ return; } var my=++SPK; speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); VOICE=VOICE||pickVoice(); if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; } else u.lang='en-AU'; u.rate=rate||1; u.pitch=1.15;
    var lb=document.querySelector('.libby'); if(lb) lb.classList.add('talk');
    u.onend=function(){ var l=document.querySelector('.libby'); if(l) l.classList.remove('talk'); if(my!==SPK) return; if(onEnd) onEnd(); };
    u.onerror=function(){ var l=document.querySelector('.libby'); if(l) l.classList.remove('talk'); };
    speechSynthesis.speak(u);
  }catch(e){}
}
if(window.speechSynthesis){ try{ speechSynthesis.onvoiceschanged=function(){ VOICE=pickVoice(); }; }catch(e){} }
var RATE={fast:1.35,again:1.15,slow:0.7};
/* Libby box: who says it, the words, and the replay buttons */
function libbyBox(text,id,who){
  var shown=REVEAL[id];
  return '<div class="libby"><div class="bot">'+(who&&who.e||'🤖')+'</div><div class="bub"><span class="who">'+(who&&who.n||'Libby')+'</span>'+
    (shown?text:'<span class="hid" aria-hidden="true">'+text+'</span>')+'</div></div>'+
    '<div class="ctrls lbc"><button class="cb" data-act="lb" data-m="fast" data-id="'+id+'">▶️ Listen</button>'+
    '<button class="cb" data-act="lb" data-m="again" data-id="'+id+'">🔁 Sorry, I didn\'t catch that.</button>'+
    '<button class="cb" data-act="lb" data-m="slow" data-id="'+id+'">🐢 Could you slow down a bit?</button>'+
    '<button class="cb'+(shown?' on':'')+'" data-act="lb" data-m="show" data-id="'+id+'">👀 Show the words</button></div>';
}
var LINES={};
function line(id,text){ LINES[id]=text.replace(/<[^>]+>/g,''); return id; }

/* ---------- zone state ---------- */
function zs(Z){
  var r=S.zones[Z.id];
  if(!r){ var seq=[]; Z.parts.forEach(function(p,pi){ if(p.intro) seq.push('i'+pi); var idx=range(p.steps.length); if(p.shuffle!==false) idx=shuffle(idx); idx.forEach(function(si){ seq.push(pi+'-'+si); }); });
    r=S.zones[Z.id]={seq:seq,pos:0,ord:{},cur:{x:[]},miss:0,done:false}; }
  return r;
}
function stepOf(Z,key){ var a=key.split('-'); return {part:Z.parts[+a[0]],step:Z.parts[+a[0]].steps[+a[1]]}; }
function ordFor(r,key,n){ if(!r.ord[key]||r.ord[key].length!==n) r.ord[key]=shuffle(range(n)); return r.ord[key]; }

/* ---------- common bits ---------- */
function strip(){
  var t='🌙 After Hours at the Library';
  if(S.view==='zone'){ var Z=zoneById(S.zone); if(Z) t=Z.emo+' '+Z.name; }
  return '<div class="strip">'+(S.view!=='cover'&&S.view!=='intro'?'<button class="sb" data-act="plan" aria-label="Floor plan">🗺️<span class="wide"> Plan</span></button>':'')+
    '<div class="ttl">'+t+'</div><button class="sb" data-act="size-" aria-label="Smaller text">A−</button><button class="sb" data-act="size+" aria-label="Bigger text">A+</button>'+
    '<button class="sb'+(S.mute?' off':'')+'" data-act="mute" aria-label="Sound">'+(S.mute?'🔇':'🔊')+'</button><button class="sb" data-act="fs" aria-label="Full screen">⛶</button></div>';

  function mv(e){ var r=sh.getBoundingClientRect(); TORCH.x=Math.round(e.clientX-r.left); TORCH.y=Math.round(e.clientY-r.top); sh.style.setProperty('--x',TORCH.x+'px'); sh.style.setProperty('--y',TORCH.y+'px'); }

/* --- dlock: the librarian's letter dial lock for teacher codes --- */
var ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
STEP.dlock=function(Z,r,key,st,part,cur){
  if(!cur.d){ cur.d=[]; for(var i=0;i<st.code.length;i++) cur.d.push(0); }
  var h='<div class="tcard">'+st.task+'</div><div class="q" style="margin-top:.7rem">🔐 Frances gives you the code. Turn the dials ▲ ▼. Then open the lock.</div>';
  h+='<div class="dlock'+(FLASH&&FLASH.k==='bad'?' shake':'')+(cur.ok?' open':'')+'">';
  cur.d.forEach(function(v,j){ h+='<span class="ldial"><button class="dbtn" data-act="dl" data-j="'+j+'" data-dir="-1" aria-label="Back one letter"'+(cur.ok?' disabled':'')+'>▲</button><span class="lwin">'+ABC.charAt(v)+'</span><button class="dbtn" data-act="dl" data-j="'+j+'" data-dir="1" aria-label="Next letter"'+(cur.ok?' disabled':'')+'>▼</button></span>'; });
  h+='</div>';
  if(cur.ok) return h+fbGood(st,key)+nextBtn();
  h+='<button class="btn" style="--c:'+Z.c+'" data-act="dlgo"><span>🔓 Open the lock</span></button>';
  if(cur.bad) h+='<div class="fb bad"><div class="burst">OOPS!</div><div class="fbt"><b>That is not the code.</b> Show your work to Frances. Frances gives you the code.</div></div>';
  return h;
};
ACT.dl=function(el){ var c=ctx(); if(c.r.cur.ok) return; var j=+el.getAttribute('data-j'), d=+el.getAttribute('data-dir'); c.r.cur.d[j]=(c.r.cur.d[j]+d+26)%26; c.r.cur.bad=false; sfx('tap'); save(); render(); };
ACT.dlgo=function(){ var c=ctx(), cur=c.r.cur; if(cur.ok) return; var w=cur.d.map(function(v){ return ABC.charAt(v); }).join(''); if(w===c.st.code){ cur.bad=false; right(c); } else { cur.bad=true; sfx('bad'); FLASH={k:'bad'}; } save(true); render(); };

/* --- player: a podcast player read by Libby's voice --- */
var PLAYER={key:null,i:0,on:false,slow:false};
function sentences(t){ return t.match(/[^.!?]+[.!?]+/g).map(function(s){ return s.trim(); }); }
function playerBox(Z,key,text){
  if(PLAYER.key!==key){ stopSpeech(); PLAYER={key:key,i:0,on:false,slow:PLAYER.slow}; }
  var ss=sentences(text), pct=Math.round(100*PLAYER.i/ss.length);
  return '<div class="player" style="--c:'+Z.c+'"><div class="ph">🎙️ <b>Talk Harbour Podcast</b> · A ferry trip to Milsons Point</div><div class="ptrack"><i style="width:'+pct+'%"></i></div>'+
   '<div class="ptime">Sentence '+Math.min(PLAYER.i+1,ss.length)+' of '+ss.length+'</div><div class="pctl2">'+
   '<button class="pb" data-act="pl" data-m="back" aria-label="Back one sentence">⏮</button>'+
   (PLAYER.on?'<button class="pb big" data-act="pl" data-m="pause" aria-label="Pause">⏸</button>':'<button class="pb big" data-act="pl" data-m="play" aria-label="Play">▶</button>')+
   '<button class="pb" data-act="pl" data-m="restart" aria-label="Start again">↺</button>'+
   '<button class="pb spd'+(PLAYER.slow?' on':'')+'" data-act="pl" data-m="speed">'+(PLAYER.slow?'0.75x':'1x')+'</button></div></div>';
}
var LISTEN9='Last Sunday, I went to Milsons Point with my sister. We caught the ferry from Circular Quay at ten o\'clock. The trip took only ten minutes, but the view was amazing. We saw the Opera House and the Harbour Bridge. At Milsons Point, we walked to Luna Park. It was free to go in, but the rides cost money. We didn\'t go on the rides. We had ice cream and sat near the water. Then we walked across the Harbour Bridge back to the city. It took about forty minutes. My legs were tired, but I was very happy. Next time, I want to take my children.';
function playOn(){
  var ss=sentences(LISTEN9);
  if(PLAYER.i>=ss.length){ PLAYER.on=false; PLAYER.i=ss.length; render(); return; }
  var k=PLAYER.key;
  speak(ss[PLAYER.i],PLAYER.slow?0.72:1,function(){ if(!PLAYER.on||PLAYER.key!==k) return; PLAYER.i++; refreshPlayer(); playOn(); });
}
function refreshPlayer(){ var c=ctx(); if(S.view!=='zone'||!c.st||!c.st.listen) return; var keepY=window.scrollY; render(); try{ window.scrollTo(0,keepY); }catch(e){} }
ACT.pl=function(el){ var m=el.getAttribute('data-m'), n=sentences(LISTEN9).length;
  if(m==='play'){ if(PLAYER.i>=n) PLAYER.i=0; PLAYER.on=true; refreshPlayer(); playOn(); }
  else if(m==='pause'){ PLAYER.on=false; stopSpeech(); refreshPlayer(); }
  else if(m==='back'){ PLAYER.i=Math.max(0,PLAYER.i-1); PLAYER.on=true; stopSpeech(); refreshPlayer(); playOn(); }
  else if(m==='restart'){ PLAYER.i=0; PLAYER.on=true; stopSpeech(); refreshPlayer(); playOn(); }
  else if(m==='speed'){ PLAYER.slow=!PLAYER.slow; refreshPlayer(); }
};

/* --- gapfill: tap a word chip or a stamp, then tap the gap --- */
function gapParse(t){ var segs=[],ans=[],re=/\{([^}]+)\}/g,last=0,m; while((m=re.exec(t))){ segs.push(t.slice(last,m.index)); ans.push(m[1]); last=m.index+m[0].length; } segs.push(t.slice(last)); return {segs:segs,ans:ans}; }
STEP.gapfill=function(Z,r,key,st,part,cur){
  var g=gapParse(st.t), bank=st.reuse?st.bank:g.ans.concat(st.extra||[]), ord=ordFor(r,key,bank.length);
  cur.f=cur.f||{};
  var h='';
  if(st.listen) h+=playerBox(Z,key,LISTEN9);
  h+='<div class="q">'+(st.q||part.q||'Tap a word. Then tap the gap.')+'</div><div class="'+(st.reuse?'msg':'gtext')+'">';
  g.segs.forEach(function(s,i){ h+=s.replace(/\n/g,'<br>'); if(i<g.ans.length){ var filled=cur.f[i]; var c='gp'+(filled!==undefined?' full':'')+(st.reuse?' sgap':''); if(FLASH&&FLASH.pos===i&&FLASH.k==='bad') c+=' shake';
    h+='<button class="'+c+'" data-act="gp" data-i="'+i+'"'+(filled!==undefined||cur.ok?' disabled':'')+'>'+(filled!==undefined?(st.reuse?'<span class="ink">'+filled+'</span>':filled):'<small>'+(i+1)+'</small>')+'</button>'; } });
  h+='</div>';
  if(!cur.ok){
    h+='<div class="'+(st.reuse?'pads':'chips')+'">';
    ord.forEach(function(bi,pos){ var used=!st.reuse&&cur.used&&cur.used.indexOf(pos)>=0; if(used) return; var c=(st.reuse?'pad':'chip')+(cur.sel===pos?' sel':'');
      h+='<button class="'+c+'" style="--c:'+Z.c+'" data-act="chip" data-i="'+pos+'">'+(st.reuse?'🔖 ':'')+bank[bi]+'</button>'; });
    h+='</div>';
    if(cur.need) h+='<p class="mut">👆 Tap a '+(st.reuse?'stamp':'word')+' first. Then tap a gap.</p>';
  }
  if(cur.ok) h+=fbGood(st,key)+nextBtn(); else if(cur.bad) h+=fbBad(st,cur.badWhy||st.hint);
  return h;
};
ACT.chip=function(el){ var c=ctx(); if(c.r.cur.ok) return; c.r.cur.sel=+el.getAttribute('data-i'); c.r.cur.need=false; sfx('tap'); save(); var y=window.scrollY; render(); try{ window.scrollTo(0,y); }catch(e){} };
ACT.gp=function(el){ var c=ctx(), cur=c.r.cur, st=c.st; if(cur.ok) return; var i=+el.getAttribute('data-i'), y=window.scrollY;
  if(cur.sel===undefined||cur.sel===null){ cur.need=true; render(); try{ window.scrollTo(0,y); }catch(e){} return; }
  var g=gapParse(st.t), bank=st.reuse?st.bank:g.ans.concat(st.extra||[]), word=bank[c.r.ord[c.key][cur.sel]];
  if(word===g.ans[i]){ cur.f[i]=word; if(!st.reuse){ cur.used=cur.used||[]; cur.used.push(cur.sel); } cur.sel=null; cur.bad=false; sfx(st.reuse?'stamp':'tap');
    if(Object.keys(cur.f).length===g.ans.length) right(c); }
  else { cur.bad=true; cur.badWhy=(st.why2&&st.why2[word])||st.hint; c.r.miss++; sfx('bad'); FLASH={k:'bad',pos:i}; cur.sel=null; }
  save(true); render(); try{ window.scrollTo(0,y); }catch(e){} };

/* --- reels: the phrasal verb slot machine --- */
STEP.reels=function(Z,r,key,st,part,cur){
  if(!cur.d){ cur.d=st.r.map(function(o,j){ var ord=ordFor(r,key+'r'+j,o.length); return ord[0]===0?1:0; }); }
  var h='<div class="q">🎰 '+(cur.ok?st.s.replace('______','<b class="vb">'+st.r.map(function(o){ return o[0]; }).filter(function(x){ return x!=='–'; }).join(' ')+'</b>'):st.s)+'</div>';
  h+='<div class="slotm'+(cur.ok?' jackpot':'')+'" style="--c:'+Z.c+'"><div class="slotlights">💡💡💡💡💡</div><div class="reels">';
  st.r.forEach(function(o,j){ var ord=ordFor(r,key+'r'+j,o.length), n=o.length, v=cur.d[j];
    var spin=FLASH&&FLASH.k==='spin'&&FLASH.pos===j, bad=cur.wr&&cur.wr.indexOf(j)>=0;
    h+='<button class="reel'+(spin?' spin':'')+(bad?' bad':'')+'" data-act="reel" data-j="'+j+'"'+(cur.ok?' disabled':'')+' aria-label="Reel '+(j+1)+'"><span class="rprev">'+o[ord[(v-1+n)%n]]+'</span><span class="rcur">'+o[ord[v]]+'</span><span class="rnext">'+o[ord[(v+1)%n]]+'</span></button>'; });
  h+='</div>'+(cur.ok?'':'<button class="lever" data-act="lever" aria-label="Pull the lever">🕹️ PULL</button>')+'</div>';
  if(!cur.ok) h+='<p class="mut">Tap a reel to turn it. Then pull the lever. (– means no word.)</p>';
  if(cur.ok) h+=fbGood(st,key)+nextBtn(); else if(cur.bad) h+=fbBad(st,(cur.wr&&cur.wr.length===1?'One reel is wrong. It is red. ':'')+(st.hint||''));
  return h;
};
ACT.reel=function(el){ var c=ctx(); if(c.r.cur.ok) return; var j=+el.getAttribute('data-j'), n=c.st.r[j].length; c.r.cur.d[j]=(c.r.cur.d[j]+1)%n; c.r.cur.wr=(c.r.cur.wr||[]).filter(function(x){ return x!==j; }); FLASH={k:'spin',pos:j}; sfx('tap'); save(); render(); };
ACT.lever=function(){ var c=ctx(), cur=c.r.cur; if(cur.ok) return; var bad=[]; c.st.r.forEach(function(o,j){ if(c.r.ord[c.key+'r'+j][cur.d[j]]!==0) bad.push(j); });
  if(!bad.length){ cur.bad=false; cur.wr=[]; right(c); sfx('win'); } else { cur.bad=true; cur.wr=bad; c.r.miss++; sfx('bad'); }
  save(true); render(); };

STEP.spell=function(Z,r,key,st,part,cur){
  var all=st.tiles, ord=ordFor(r,key,all.length); cur.used=cur.used||[];
  var h='';
  if(cur.ok){ line(key,st.done); REVEAL[key]=true; h+=libbyBox(st.done,key,{e:'😌',n:'Libby (slowly now)'}); }
  else { line(key+'g',st.gab); h+=libbyBox(st.gab,key+'g',{e:'🤖',n:'Libby (very fast!)'}); }
  h+='<div class="q">'+st.q+'</div><div class="spell">';
  var n=0; st.groups.forEach(function(g,gi){ h+='<span class="sword">'; for(var i=0;i<g;i++){ var p=cur.used[n]; h+='<span class="sl'+(p===undefined?'':' in')+'">'+(p===undefined?'':all[ord[p]])+'</span>'; n++; } h+='</span>'; });
  h+='</div>';
  if(cur.ok) return h+fbGood(st,key)+'<button class="btn" style="--c:#2ee86a" data-act="next"><span>🚪 Walk out of the library!</span></button>';
  h+='<div class="ltiles">';
  ord.forEach(function(ai,pos){ var c='ltile'; if(cur.used.indexOf(pos)>=0) c+=' used'; if(FLASH&&FLASH.pos===pos&&FLASH.k==='bad') c+=' shake'; h+='<button class="'+c+'" data-act="lt" data-i="'+pos+'"'+(cur.used.indexOf(pos)>=0?' disabled':'')+'>'+all[ai]+'</button>'; });
  h+='</div>';
  if(cur.used.length) h+='<button class="btn white" data-act="ltback"><span>⌫ Take back a letter</span></button>';
  if(cur.bad) h+=fbBad(st);
  return h;
};
ACT.lt=function(el){ var c=ctx(), cur=c.r.cur; if(cur.ok) return; cur.used=cur.used||[]; var pos=+el.getAttribute('data-i'), want=c.st.tiles[cur.used.length], got=c.st.tiles[c.r.ord[c.key][pos]];
  if(got===want){ cur.used.push(pos); cur.bad=false; sfx('tap'); if(cur.used.length===c.st.tiles.length){ right(c); setTimeout(function(){ speak(c.st.done,RATE.slow); },300); } }
  else { cur.bad=true; c.r.miss++; sfx('bad'); FLASH={k:'bad',pos:pos}; }
  save(true); render(); };
ACT.ltback=function(){ var c=ctx(); if(c.r.cur.ok) return; c.r.cur.used.pop(); save(); render(); };
