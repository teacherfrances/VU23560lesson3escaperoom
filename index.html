<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The B Block Board Game</title>
<style>
:root{
  --felt:#050807;--red:#ef3b3b;--yel:#ffd21f;--grn:#21c55d;--blu:#2f7df6;--pur:#a855f7;--ora:#ff8a1f;--pnk:#ff5fa8;--tea:#14c8b8;
  --wood:#d9a35f;--wood2:#a86c2c;--cream:#fff6dd;--c:#ffd21f;--ok:#21c55d;--bad:#ef3b3b;
  --fd:"Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --fb:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:28px;background:#000;overflow-x:clip}
body{margin:0;color:#fff;font-family:var(--fb);line-height:1.38;min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%;
  background:#000 radial-gradient(ellipse at 50% -10%,rgba(33,197,93,.16),transparent 55%) fixed}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.03) 0 2px,transparent 2px 6px)}
button{font:inherit;font-size:1rem;color:inherit;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.disp{font-family:var(--fd);font-weight:900;line-height:1.12;margin:.15rem 0;overflow-wrap:anywhere}
h1{font-size:min(1.45rem,9vw)}h2{font-size:min(1.15rem,7.5vw)}
p{margin:.35rem 0}
.mut{color:#d6dbe0}

/* top tray */
.tray{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;padding:.3rem .45rem;background:linear-gradient(#2a1a0c,#160d05);border-bottom:6px solid var(--wood2);box-shadow:0 4px 0 #000}
.tray .ttl{flex:1 1 auto;min-width:5rem;font-family:var(--fd);font-weight:900;font-size:.82rem;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .2rem}
.tb{min-height:2.2rem;min-width:2.2rem;padding:.05rem .45rem;border:0;border-radius:.6rem;background:linear-gradient(#f3c98d,var(--wood));color:#3a2108;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--wood2);line-height:1}
.tb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.tb.off{filter:grayscale(1)}
.tb:focus-visible,.btn:focus-visible{outline:4px solid #fff;outline-offset:3px}

main{max-width:1100px;margin:0 auto;padding:.7rem .6rem 4rem;overflow-wrap:break-word}
.card{position:relative;background:#fff;color:#1d1d1d;border-radius:1.1rem;padding:.75rem .85rem;margin:.75rem .1rem;box-shadow:0 .45rem 0 rgba(0,0,0,.35),0 0 0 .3rem var(--c)}
.card.dark{background:#121614;color:#fff;box-shadow:0 .45rem 0 rgba(0,0,0,.35),0 0 0 .25rem var(--c)}
.band{display:flex;align-items:center;gap:.5rem;margin:-.75rem -.85rem .6rem;padding:.45rem .85rem;border-radius:1.1rem 1.1rem 0 0;background:var(--c);color:#111;font-family:var(--fd);font-weight:900}
.band .be{font-size:min(1.8rem,9vw);line-height:1}
.band small{display:block;font-family:var(--fb);font-weight:700;font-size:.78rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:2.3rem;max-width:calc(100% - .4rem);padding:.3rem 1.1rem;margin:.35rem .35rem .35rem 0;border:0;border-radius:2rem;background:var(--c);color:#111;font-family:var(--fd);font-weight:900;cursor:pointer;box-shadow:0 .3rem 0 rgba(0,0,0,.45);overflow-wrap:anywhere;text-align:center}
.btn:active{transform:translateY(.2rem);box-shadow:0 .1rem 0 rgba(0,0,0,.45)}
.btn.wood{background:linear-gradient(#f3c98d,var(--wood));color:#3a2108}
.btn.ghost{background:#2a302d;color:#fff}
.warn{background:#2a2200;border:3px dashed var(--yel);border-radius:.8rem;padding:.5rem .7rem;margin:.5rem 0;color:#fff2b0}
.teamin{font:inherit;font-size:1rem;width:100%;max-width:18rem;min-height:2.3rem;padding:.3rem .7rem;border:4px solid var(--wood2);border-radius:.8rem;background:var(--cream);color:#111}
.big{font-size:1.12rem}

/* cover */
.boxlid{text-align:center;background:linear-gradient(135deg,var(--red),var(--ora) 30%,var(--yel) 50%,var(--grn) 70%,var(--blu));border-radius:1.4rem;padding:.35rem;margin:.6rem .1rem;box-shadow:0 .6rem 0 rgba(0,0,0,.5)}
.boxlid .inner{background:#111;border-radius:1.1rem;padding:1rem .7rem}
.boxlid .t1{font-family:var(--fd);font-weight:900;font-size:min(2rem,10vw);line-height:1.05;color:#fff;text-shadow:0 .2rem 0 var(--red),0 .4rem 0 #000}
.boxlid .t2{display:inline-block;margin-top:.5rem;background:var(--yel);color:#111;border-radius:2rem;padding:.1rem .8rem;font-weight:900}
.boxlid .em{font-size:min(2.4rem,12vw)}
.ages{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;font-size:.8rem}
.ages span{border:2px solid #fff;border-radius:2rem;padding:0 .6rem}

/* door screen */
.lockscreen{background:#0b1d2b;border:6px solid #39424a;border-radius:1.2rem;padding:.7rem .8rem;color:#bfe9ff;font-family:Consolas,"Lucida Console","DejaVu Sans Mono",monospace;box-shadow:inset 0 0 1.2rem rgba(0,180,255,.25),0 .4rem 0 #000}
.lockscreen .lh{display:flex;justify-content:space-between;gap:.4rem;flex-wrap:wrap;border-bottom:2px solid #1f4a66;padding-bottom:.3rem;margin-bottom:.4rem;color:#7fd4ff;font-weight:700}
.lockscreen p{margin:.35rem 0;overflow-wrap:anywhere}
.blink{animation:blink 1s infinite}
.sticky{background:#fff27a;color:#222;border-radius:.2rem;padding:.6rem .8rem;margin:.9rem .4rem;transform:rotate(-1deg);box-shadow:0 .4rem .8rem rgba(0,0,0,.6);overflow-wrap:anywhere}
.sticky p{margin:.3rem 0}

/* rack */
.rackwrap{background:#121614;border-radius:1.1rem;padding:.55rem .6rem .7rem;margin:.6rem .1rem;box-shadow:0 0 0 .25rem var(--wood2)}
.rackhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.3rem;align-items:center;font-weight:700;font-size:.85rem}
.rack{display:flex;flex-wrap:wrap;gap:.25rem;justify-content:center;background:linear-gradient(#b07335,#7a4a1c);border-radius:.4rem;padding:.35rem .3rem .55rem;margin-top:.35rem;box-shadow:inset 0 -.35rem 0 rgba(0,0,0,.3)}
.tile{position:relative;display:inline-flex;align-items:center;justify-content:center;width:min(2.1rem,11vw);height:min(2.3rem,12vw);border-radius:.3rem;background:linear-gradient(#fff3d6,#f1d9a6);color:#3a2108;font-family:var(--fd);font-weight:900;font-size:min(1.2rem,6.5vw);box-shadow:0 .2rem 0 #b8955a}
.tile sub{position:absolute;right:.12rem;bottom:.02rem;font-size:.42em;font-family:var(--fb)}
.tile.empty{background:rgba(0,0,0,.25);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);color:rgba(255,255,255,.35)}
.tile.new{animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
.stars{color:var(--yel);font-weight:900}

/* board */
.board{position:relative;display:grid;gap:.45rem;padding:.6rem;margin:.4rem .1rem 1rem;border-radius:1.3rem;background:#0a3d22;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px);background-size:12px 12px;box-shadow:0 0 0 .35rem var(--wood),0 0 0 .6rem var(--wood2),0 .9rem 0 .6rem rgba(0,0,0,.5)}
.sp{position:relative;min-height:6.4rem;border:0;border-radius:1rem;padding:.4rem .45rem .45rem;cursor:pointer;color:#111;text-align:left;display:flex;flex-direction:column;gap:.05rem;background:var(--c);
  box-shadow:inset 0 -.35rem 0 rgba(0,0,0,.22),inset 0 .25rem 0 rgba(255,255,255,.35),0 .25rem 0 rgba(0,0,0,.4);overflow:hidden}
.sp:hover,.sp:focus-visible{outline:4px solid #fff;outline-offset:2px;z-index:2}
.sp .num{position:absolute;right:.35rem;top:.25rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;color:#111;font-family:var(--fd);font-weight:900;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.sp .se{font-size:min(1.8rem,9vw);line-height:1}
.sp .st{font-family:var(--fd);font-weight:900;font-size:min(.95rem,5vw);line-height:1.1;overflow-wrap:anywhere}
.sp .ss{font-size:.72rem;font-weight:700;margin-top:auto;overflow-wrap:anywhere}
.sp .tc{display:inline-block;align-self:flex-start;background:#111;color:#fff;border-radius:2rem;padding:0 .4rem;font-size:.66rem;font-weight:700}
.sp.done{background:#e9e9e9;color:#555}
.sp.done .ptile{position:absolute;right:.35rem;bottom:.35rem}
.sp.soon{opacity:.35;cursor:not-allowed}
.sp.start{background:#fff;cursor:default}
.sp.door{background:#3b2a1a;color:#fff;background-image:repeating-linear-gradient(90deg,#4a3420 0 14px,#3b2a1a 14px 28px)}
.sp.door.open{background:var(--grn);color:#111;background-image:none}
.arrow{position:absolute;font-size:.9rem;color:#fff;opacity:.8;pointer-events:none}
.pawn{position:absolute;z-index:6;width:2.2rem;height:2.6rem;pointer-events:none;transition:left .17s ease,top .17s ease;filter:drop-shadow(0 .25rem 0 rgba(0,0,0,.5))}
.pawn i{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3b0,#c97b2c 60%,#8a4c14)}
.pawn i.h{top:0;width:1.1rem;height:1.1rem}
.pawn i.b{top:.9rem;width:1.5rem;height:1.5rem;border-radius:50% 50% .4rem .4rem}
.pawn.hop{animation:hop .17s infinite alternate}
.dice{position:fixed;left:50%;top:40%;z-index:50;transform:translate(-50%,-50%);font-size:4.5rem;pointer-events:none;filter:drop-shadow(0 .4rem 0 rgba(0,0,0,.6));animation:roll .7s ease-out}
.legend{font-size:.8rem;color:#d6dbe0;margin:.2rem .2rem 0}

/* space screen */
.dots{display:flex;flex-wrap:wrap;gap:.25rem;margin:.4rem .2rem}
.dots i{width:.85rem;height:.85rem;border-radius:50%;background:#2c332f}
.dots i.d{background:var(--c)}.dots i.n{background:#fff}
.q{font-size:1.05rem;font-weight:700;margin:.25rem 0 .5rem;overflow-wrap:anywhere}
.sit{background:#f3f0e6;border-left:.4rem solid var(--c);border-radius:.4rem;padding:.4rem .6rem;margin:.2rem 0 .45rem;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:.45rem}
.op{text-align:left;min-height:2.3rem;padding:.4rem .8rem;border:3px solid #d8d2c2;border-radius:.9rem;background:#faf7ef;color:#111;cursor:pointer;line-height:1.3;overflow-wrap:anywhere;box-shadow:0 .2rem 0 #d8d2c2}
.op:hover:not([disabled]),.op:focus-visible{border-color:var(--c);outline:none;background:#fff}
.op.x{background:#fde8e8;border-color:var(--bad);color:#8a1c1c;text-decoration:line-through;box-shadow:none}
.op.ok{background:#dcfce7;border-color:var(--ok);font-weight:700}
.op[disabled]{cursor:default}
.switch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem}
.switch .op{text-align:center;font-family:var(--fd);font-weight:900;font-size:1.1rem}
.gapw{display:inline-block;min-width:3.5rem;border-bottom:3px dashed #999;text-align:center;font-weight:900;color:#2f7df6}
.fb{border-radius:1rem;padding:.55rem .75rem;margin:.6rem 0;animation:popin .3s;overflow-wrap:anywhere}
.fb.good{background:#dcfce7;border:3px solid var(--ok);color:#0f3d20}
.fb.bad{background:#fde8e8;border:3px solid var(--bad);color:#6b1414}
.fb b.lead{display:block;font-family:var(--fd);font-weight:900}
.saybtn{display:inline-flex;align-items:center;gap:.2rem;min-height:2.1rem;padding:0 .6rem;border:0;border-radius:2rem;background:#111;color:#fff;cursor:pointer;font-weight:700}

/* memory */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(7.5rem,42%),1fr));gap:.45rem}
.mc{position:relative;min-height:4.4rem;border:0;padding:0;background:none;cursor:pointer;perspective:800px}
.mc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.mc.up .in,.mc.got .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;border-radius:.8rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;padding:.25rem;text-align:center;overflow-wrap:anywhere;font-weight:700;line-height:1.15}
.mc .fr{background:repeating-linear-gradient(45deg,var(--c) 0 10px,#fff4 10px 20px),var(--c);box-shadow:0 .25rem 0 rgba(0,0,0,.3);font-size:1.6rem}
.mc .bk{transform:rotateY(180deg);background:#fff;border:3px solid #d8d2c2;font-size:.8rem;color:#111}
.mc .bk.w{font-family:var(--fd);font-weight:900;font-size:.95rem;color:#2f7df6}
.mc.got .bk{background:#dcfce7;border-color:var(--ok)}
.mc.no .bk{background:#fde8e8;border-color:var(--bad)}
.memstat{font-weight:700;margin:.4rem 0}

/* mail trays */
.slip{background:#fffef5;border:2px solid #ddd3b5;border-radius:.3rem;padding:.6rem .8rem;margin:.2rem auto .7rem;max-width:30rem;box-shadow:0 .35rem .8rem rgba(0,0,0,.25);transform:rotate(-1deg);font-size:1.05rem;overflow-wrap:anywhere}
.slip.drop0{animation:toL .55s forwards}.slip.drop1{animation:toM .55s forwards}.slip.drop2{animation:toR .55s forwards}
.trays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.tr{min-height:4.6rem;border:0;border-radius:.4rem .4rem 1rem 1rem;cursor:pointer;color:#111;font-weight:900;padding:.6rem .3rem .3rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.15rem;overflow-wrap:anywhere;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 30%),var(--tc);box-shadow:inset 0 .6rem 0 rgba(0,0,0,.18),0 .25rem 0 rgba(0,0,0,.35)}
.tr .te{font-size:1.5rem}
.tr.x{opacity:.4;text-decoration:line-through}
.tr.ok{outline:4px solid var(--ok);outline-offset:2px}

/* tone meter */
.meter{position:relative;max-width:22rem;margin:.2rem auto .4rem;aspect-ratio:2/1.1}
.meter svg{width:100%;height:100%;display:block}
.needle{transform-origin:100px 100px;transition:transform .8s cubic-bezier(.3,1.6,.5,1)}
.lineq{background:#fffef5;border:2px solid #ddd3b5;border-radius:.8rem;padding:.5rem .8rem;margin:.2rem 0 .6rem;font-size:1.1rem;font-weight:700;text-align:center;overflow-wrap:anywhere}
.tone3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
.tone3 .op{text-align:center;font-weight:900}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:.4rem;padding:.4rem .9rem;background:linear-gradient(90deg,var(--wood2) 0 .5rem,transparent .5rem calc(100% - .5rem),var(--wood2) calc(100% - .5rem));border-radius:.4rem}
.rung{min-height:2.7rem;border:0;border-radius:.4rem;background:linear-gradient(#f3c98d,var(--wood));color:#3a2108;font-weight:900;cursor:pointer;box-shadow:0 .2rem 0 var(--wood2);overflow-wrap:anywhere;padding:.2rem .5rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
.rung.x{opacity:.4;text-decoration:line-through}
.rung.ok{background:var(--ok);color:#fff}

/* stamp / win */
.unlock{text-align:center;overflow:hidden}
.bigtile{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5.4rem;border-radius:.5rem;background:linear-gradient(#fff3d6,#f1d9a6);color:#3a2108;font-family:var(--fd);font-weight:900;font-size:3.2rem;box-shadow:0 .4rem 0 #b8955a;animation:drop .8s .15s cubic-bezier(.2,1.5,.4,1) both}
.chance{perspective:900px;max-width:20rem;margin:.6rem auto}
.chance .ci{position:relative;min-height:8rem;transition:transform .6s;transform-style:preserve-3d}
.chance.flip .ci{transform:rotateY(180deg)}
.chance .cf,.chance .cb{position:absolute;inset:0;border-radius:1rem;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.5rem;text-align:center}
.chance .cf{background:repeating-linear-gradient(135deg,#ff8a1f 0 12px,#ffd21f 12px 24px);color:#111;font-family:var(--fd);font-weight:900;font-size:1.3rem;cursor:pointer;box-shadow:0 .4rem 0 rgba(0,0,0,.4)}
.chance .cb{transform:rotateY(180deg);background:#fff;color:#111;border:4px solid var(--ora)}
.chancebox{background:#fff8e6;color:#111;border:4px solid var(--ora);border-radius:1rem;padding:.6rem .8rem;margin:.6rem 0;text-align:left}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.saved{position:fixed;right:.6rem;bottom:.6rem;z-index:40;background:var(--grn);color:#111;border-radius:2rem;font-weight:900;padding:.05rem .7rem;font-size:.75rem;opacity:0;transition:opacity .3s;pointer-events:none}
.saved.show{opacity:1}

@keyframes blink{50%{opacity:.25}}
@keyframes hop{to{transform:translateY(-.4rem)}}
@keyframes roll{0%{transform:translate(-50%,-50%) rotate(0) scale(.4)}60%{transform:translate(-50%,-50%) rotate(540deg) scale(1.2)}100%{transform:translate(-50%,-50%) rotate(720deg) scale(1)}}
@keyframes drop{0%{transform:translateY(-2.5rem) rotate(-15deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes toL{to{transform:translate(-30%,6rem) scale(.3);opacity:0}}
@keyframes toM{to{transform:translate(0,6rem) scale(.3);opacity:0}}
@keyframes toR{to{transform:translate(30%,6rem) scale(.3);opacity:0}}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  main{padding:.5rem .35rem 3rem}.card{padding:.6rem .6rem}.band{margin:-.6rem -.6rem .5rem;padding:.4rem .6rem}
  .tray{position:relative}.tray .ttl{order:9;flex-basis:100%}.wide{display:none}
  .trays,.tone3{grid-template-columns:minmax(0,1fr)}.tr{flex-direction:row;justify-content:center;min-height:2.8rem}
}
.dots i.n{background:#fff;box-shadow:0 0 0 3px #111}
/* ---- Section 2 ---- */
.slots3{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:.3rem;margin:.3rem 0 .6rem}
.slot3{flex:1 1 7rem;min-width:0;min-height:3.6rem;border:3px dashed #bbb;border-radius:.6rem;padding:.25rem .4rem;display:flex;flex-direction:column;justify-content:center;text-align:center;background:#f7f4ea;overflow-wrap:anywhere}
.slot3 small{font-size:.62rem;font-weight:900;color:#666}
.slot3 span{font-weight:900;font-size:1.05rem}
.slot3.full{border-style:solid;color:#111}
.slot3.s0.full{background:#dbeafe;border-color:#2f7df6}.slot3.s1.full{background:#fee2e2;border-color:#ef3b3b}.slot3.s2.full{background:#dcfce7;border-color:#21c55d}
.plus{align-self:center;font-weight:900;font-size:1.2rem;color:#888}
.blocks{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center}
.blk{min-height:2.6rem;max-width:100%;padding:.2rem .9rem;border:0;border-radius:.4rem;background:linear-gradient(#ffb15c,#ff8a1f);color:#3a1a00;font-weight:900;cursor:pointer;box-shadow:0 .3rem 0 #b85c00,inset 0 .2rem 0 rgba(255,255,255,.4);overflow-wrap:anywhere}
.blk.x{background:linear-gradient(#ff8b8b,#ef3b3b);color:#fff}
.slots3.demo{pointer-events:none}
.tm{background:linear-gradient(135deg,#2e1065,#581c87);border-radius:1rem;padding:.6rem;box-shadow:0 .35rem 0 #1e0a40,inset 0 0 1.5rem rgba(168,85,247,.5)}
.tmscreen{background:#0b0320;color:#e9d5ff;border:3px solid #a855f7;border-radius:.6rem;padding:.6rem .7rem;font-size:1.1rem;font-weight:700;text-align:center;box-shadow:inset 0 0 1rem rgba(168,85,247,.6);overflow-wrap:anywhere;margin-bottom:.6rem}
.tm.go0 .tmscreen,.tm.go1 .tmscreen,.tm.go2 .tmscreen,.tm.go3 .tmscreen{animation:warp .7s}
.tmdial{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.tbtn{min-height:3.6rem;border:3px solid #c084fc;border-radius:.8rem;background:#1a0b33;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.2rem;overflow-wrap:anywhere;text-align:center}
.tbtn .te{font-size:1.3rem}.tbtn small{font-size:.7rem;color:#d8b4fe}
.tbtn.x{opacity:.35;text-decoration:line-through}
.tbtn.ok{background:#21c55d;border-color:#fff;color:#111}.tbtn.ok small{color:#111}
.lockbox{display:flex;align-items:center;gap:.6rem;background:#0f2e2b;color:#fff;border-radius:1rem;padding:.6rem .7rem;margin-bottom:.6rem;box-shadow:0 .3rem 0 #072420}
.lockbox .lk{font-size:min(2.6rem,12vw);line-height:1}
.lockbox.open .lk{animation:drop .6s}
.lockbox>div:last-child{min-width:0}
.job{display:inline-block;background:#14c8b8;color:#062a26;border-radius:2rem;padding:0 .6rem;font-weight:900;font-size:.8rem;margin-bottom:.2rem}
.ksent{font-size:1.15rem;font-weight:700;overflow-wrap:anywhere}
.kw{color:#5eead4}

   go:'I remember! ➜',

/* ===== The Door: write to LockSmart ===== */
function D(o,why,hint){ return {k:'compose',o:o,why:why,hint:hint||'Polite, calm and clear. No shouting, no rude words, no texting words.'}; }
var DOOR={id:13,name:'The Door',emo:'🚪',c:'#21c55d',door:true,skill:'Write the email',
 parts:[
  {label:'Write to LockSmart',shuffle:false,
   intro:'<p class="big">🚪 You have twelve tiles. Now write to LockSmart!</p><div class="lockscreen"><div class="lh"><span>🔐 LOCKSMART</span><span>Customer Care</span></div><p>Please send us a <b>polite, calm and clear</b> email. We do not answer rude emails. We do not answer emails with no subject line.</p></div><p>Build the email one carriage at a time. For each stage, choose the best line. ✉️</p>',
   go:'Start writing ✏️',
   steps:[
    D(['Door B.1.33 is locked, please help','HELP!!! OPEN THE DOOR NOW','hi dana'],'Short and clear: the problem and the room. No CAPITALS and no !!!'),
    D(['Dear Dana,','Hey you,','DANA!!!'],'<b>Dear</b> + the name and a comma.'),
    D(['We are an English class in Room B.1.33, B Block. We would like to ask for two things.','Your lock is rubbish and we are very angry.','we r stuck lol'],'Say who you are and that you have two things to ask. Calm, full sentences.'),
    D(['Firstly, the smart lock on our door is stuck, so we cannot get out. Could you please open it?','Firstly, open the door. Now.','Firstly the lock stuck can you open'],'The problem + a polite request: <b>Could you please ...?</b>'),
    D(['Secondly, the screen on the door shows an error. Would you be able to check it?','Secondly, fix your silly screen.','Secondly, screen error, whatever.'],'A new paragraph and a polite request: <b>Would you be able to ...?</b>'),
    D(['Could you please open the door before 12 pm today? Our class finishes at 12.','Open it when you like.','DO IT RIGHT NOW OR ELSE!!!'],'A real time, and the reason. Calm, not angry.'),
    D(['You can call Frances on 0491 570 159 or reply to this email.','Call us. You know the number.','dont call just open it'],'A phone number and another way to reply.'),
    D(['Thank you very much for your help.','Thanks, I guess.','You should say sorry to us.'],'One short, kind line.'),
    D(['Kind regards,<br>{TEAM}','bye','From the angry class'],'<b>Kind regards</b> and your name on <b>two lines</b>.')
   ]},
  {label:'Send it',
   steps:[{k:'send',yes:'Dana replied! 📬',why:'A polite, calm and clear email gets an answer. 😊',
    reply:'<div class="dl">Dear {TEAM},</div><div class="dl">Thank you for your polite, calm and clear email. 😊 We checked the lock, and we fixed the problem.</div><div class="dl">To open the door, please put your twelve letter tiles in order. They make our number one rule for emails.</div><div class="dl">Kind regards,<br>Dana<br>LockSmart Customer Care</div>'}]},
  {label:'The secret message',
   steps:[{k:'tiles',yes:'CALM AND CLEAR! 🔓',why:'Calm and clear: the number one rule for writing to a business. 🔤✨',hint:'Read the LockSmart screen again: a polite, ____ and ____ email. Three words: 4 letters, 3 letters, 5 letters.'}]}
 ]};

/* ===== The win screen ===== */
var AGAIN_ARMED=false;
function viewWin(){
  var miss=0, rows=''; SPACES.forEach(function(Z){ var r=S.spaces[Z.id]; if(r) miss+=r.miss||0; if(Z.door) return; var m=r?r.miss:0;
    rows+='<span class="wsp" style="--c:'+Z.c+'"><span>'+Z.emo+' '+Z.id+'</span><b>'+(m<=1?'⭐⭐⭐':(m<=4?'⭐⭐':'⭐'))+'</b></span>'; });
  var k=0, msg=''; WORDS.forEach(function(len){ msg+='<span class="mword">'; for(var i=0;i<len;i++,k++) msg+=tileHtml(PHRASE.charAt(k)); msg+='</span>'; });
  var h='<div class="card unlock winc" style="--c:#21c55d"><div class="opendoor"><span class="dframe"><span class="dleaf">🚪</span></span><span class="sun">☀️</span></div>'+
    '<h1 class="wint">YOU ESCAPED! 🎉</h1><p class="big"><b>'+esc(S.team)+'</b>, the door of B.1.33 is open!</p><div class="msg done">'+msg+'</div>'+
    '<div class="wstats"><span>⏱️ Time<b>'+fmtTime((S.t1||Date.now())-S.t0)+'</b></span><span>🔁 Mistakes<b>'+miss+'</b></span><span>⭐ Bonus stars<b>'+(S.bonus||0)+'</b></span></div>'+
    '<div class="wgrid">'+rows+'</div>'+
    '<div class="sticky" style="text-align:left"><p><b>📌 From Frances</b></p><p>Well done, everyone! 👏 You can now write a request email to a business: nine stages, polite requests, joining words and organising words. Calm and clear, every time!</p><p>Frances</p></div>'+
    '<div><button class="btn" style="--c:#ffd21f" data-act="confetti">🎉 More confetti</button><button class="btn wood" data-act="board">🎲 Look at the board</button><button class="btn ghost" data-act="again">'+(AGAIN_ARMED?'⚠️ Tap again to start a new game':'♻️ Play again')+'</button></div></div>';
  return h;
}
ACT.confetti=function(){ stopConfetti(); startConfetti(); sfx('win'); };
(function(){ var old=ACT.again; ACT.again=function(){ if(!AGAIN_ARMED){ AGAIN_ARMED=true; render(); setTimeout(function(){ AGAIN_ARMED=false; if(S.view==='win') render(); },4000); return; } AGAIN_ARMED=false; old(); }; })();

/* ===== Space list ===== */
var SPACES=[SP1,SP2,SP3,SP4,SP5,SP6,SP7,SP8,SP9,SP10,SP11,SP12,DOOR];

load(); render();
if(S.view==='win'){ setTimeout(startConfetti,300); }
})();
